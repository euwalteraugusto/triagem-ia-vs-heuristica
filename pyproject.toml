[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
# Conjunto mínimo: erros de sintaxe/pyflakes e subconjunto de pycodestyle.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Pendências pré-existentes (imports não usados), a corrigir em PR próprio.
"api.py" = ["E401", "F401"]
"avaliar.py" = ["F401"]
"core.py" = ["F401"]
"injetar_mocks.py" = ["E401"]
